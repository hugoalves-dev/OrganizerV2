<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrganizerV2</title>
<style>
:root { font-family: Segoe UI, system-ui, sans-serif; color: #202633; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
main { height: 100%; background: #fff; border: 1px solid #e2e6ed; border-radius: 17px; padding: 14px 16px; box-shadow: 0 8px 26px #0002; overflow: hidden; }
header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 650; }
#close { border: 0; background: transparent; font-size: 20px; cursor: pointer; color: #64748b; }
#drag { display: flex; align-items: center; gap: 12px; min-width: 0; background: #ecf4ff; border: 1px dashed #8badcc; border-radius: 10px; padding: 10px; margin: 10px 0; cursor: grab; user-select: none; }
#drag:active { cursor: grabbing; }
#drag > div { min-width: 0; flex: 1; }
#file-icon { font-size: 21px; flex: none; }
#filename { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
#folder { font-size: 11px; color: #526276; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
label { font-size: 11px; font-weight: 600; display: block; }
select { width: 100%; padding: 7px; margin: 4px 0 7px; border-radius: 6px; border: 1px solid #d8dfeb; background: white; color: #202633; }
#actions { display: flex; gap: 7px; min-height: 33px; }
#actions button { flex: 1; min-width: 0; padding: 8px 3px; border: 1px solid #d3dbea; border-radius: 7px; background: #f7faff; cursor: pointer; font-size: 11px; white-space: nowrap; }
#actions button:disabled { opacity: .5; cursor: default; }
#status { margin-top: 9px; font-size: 11px; color: #516177; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<main role="status">
<header><span>✓ File organized</span><button type="button" id="close" aria-label="Dismiss">×</button></header>
<div id="drag" draggable="true" role="button" tabindex="0"><span id="file-icon" aria-hidden="true">📄</span><div>
<div id="filename"></div><div id="folder"></div></div></div>
<label for="destination">Move file to</label><select id="destination"></select>
<div id="actions"></div><div id="status">Drag to Explorer to copy</div>
</main>
<script>
(function () {
  // Install an error reporter BEFORE loading the module graph. A failed ES
  // module import never reaches main.js's initialize().catch() handler.
  window.popupDiagnostic = function (stage, message) {
    try {
      fetch('/popup-diagnostic', {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=UTF-8'},
        body: (stage + ': ' + String(message || '')).slice(0, 900),
        keepalive: true
      }).catch(function () {});
    } catch (_) {}
  };
  window.addEventListener('error', function (event) {
    window.popupDiagnostic('browser-error', event.message || 'script loading error');
  });
  window.addEventListener('unhandledrejection', function (event) {
    window.popupDiagnostic('unhandled-rejection', String(event.reason || 'unknown rejection'));
  });
  window.popupDiagnostic('bootstrap', 'index.html loaded');
})();
</script>
<script type="module">
  // A dynamic import catches missing modules, syntax errors, and failures
  // resolving generated Wails bindings, which were previously invisible.
  import('./main.js').catch(error => {
    window.popupDiagnostic('module-import-error', error?.stack || String(error));
  });
</script>
</body>
</html>

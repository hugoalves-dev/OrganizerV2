name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

  build:
    name: Build ${{ matrix.binary }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: organizer-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: organizer-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: organizer-windows-amd64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          pushd cmd/organizer
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --arch "${{ matrix.goarch }}" \
            --in winres/winres.json \
            --out rsrc
          test -s "rsrc_windows_${{ matrix.goarch }}.syso"
          popd

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o ${{ matrix.binary }} \
            ./cmd/organizer

      - uses: actions/setup-go@v5
        if: matrix.goos == 'windows'
        with:
          go-version-file: cmd/organizer-popup/go.mod
          cache: false

      - name: Build Wails popup
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          Push-Location cmd/organizer-popup
          go mod tidy
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.32 generate bindings -b -d ./assets/bindings
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'popup tests failed' }
          go build -tags production -ldflags="-H windowsgui" -o ../../organizer-popup.exe .
          if ($LASTEXITCODE -ne 0) { throw 'popup build failed' }
          $binary = [IO.File]::ReadAllBytes((Resolve-Path '../../organizer-popup.exe').Path)
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($binary, $peOffset + 0x5c)
          if ($subsystem -ne 2) { throw "popup helper has unexpected PE subsystem: $subsystem" }
          Pop-Location

      - name: Package Windows legal notices
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force licenses | Out-Null
          Copy-Item LICENSE licenses/MIT.txt
          Copy-Item THIRD_PARTY_NOTICES.md licenses/
          Copy-Item LICENSES/* licenses/
          Compress-Archive -Path organizer-windows-amd64.exe,organizer-popup.exe,licenses -DestinationPath organizer-windows-amd64-bundle.zip

      - name: Install GTK3/WebKitGTK for Linux helper
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        with:
          go-version-file: cmd/organizer-popup/go.mod
          cache: false

      - name: Build optional Linux popup (GTK3)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          CGO_ENABLED: "1"
        run: |
          cd cmd/organizer-popup
          go mod tidy
          go run -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.32 generate bindings -b -d ./assets/bindings
          go test -tags gtk3 ./...
          go build -trimpath -tags "gtk3 production" -o ../../organizer-popup .

      - name: Package Linux popup and legal notices
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir -p licenses
          cp LICENSE licenses/MIT.txt
          cp LICENSES/* licenses/
          cp THIRD_PARTY_NOTICES.md licenses/
          tar -czf organizer-linux-amd64-bundle.tar.gz organizer-linux-amd64 organizer-popup licenses

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: |
            ${{ matrix.binary }}
            organizer-popup.exe
            organizer-popup
            organizer-windows-amd64-bundle.zip
            organizer-linux-amd64-bundle.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ contains(github.ref_name, '-alpha.') }}
          prerelease: ${{ contains(github.ref_name, '-alpha.') }}
          body: >-
            ${{ contains(github.ref_name, '-alpha.') && 'Windows alpha preview of OrganizerV2 native drag effects. The Wails popup uses [wails-dragout commit 02b1a12](https://github.com/hugoalves-dev/wails-dragout/tree/02b1a12bf3b716e14abbda66ef8ba87793ca9f12) from [PR #2](https://github.com/eaxum/wails-dragout/pull/2). [Issue #1](https://github.com/eaxum/wails-dragout/issues/1) remains open for a separate Linux follow-up.' || '' }}
          files: |
            organizer-linux-amd64
            organizer-linux-arm64
            organizer-windows-amd64.exe
            organizer-popup.exe
            organizer-popup
            organizer-windows-amd64-bundle.zip
            organizer-linux-amd64-bundle.tar.gz
          generate_release_notes: true

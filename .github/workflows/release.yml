name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race ./...

  build:
    name: Build ${{ matrix.binary }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            binary: organizer-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            binary: organizer-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            binary: organizer-windows-amd64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          pushd cmd/organizer
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --arch "${{ matrix.goarch }}" \
            --in winres/winres.json \
            --out rsrc
          test -s "rsrc_windows_${{ matrix.goarch }}.syso"
          popd

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          go build \
            -ldflags="-s -w -X main.version=${VERSION}" \
            -o ${{ matrix.binary }} \
            ./cmd/organizer

      - uses: actions/setup-go@v5
        if: matrix.goos == 'windows'
        with:
          go-version-file: cmd/organizer-popup/go.mod
          cache: false

      - name: Build Wails popup
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          Push-Location cmd/organizer-popup
          go mod tidy
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.32 generate bindings -d ./assets/bindings
          go build -tags production -o ../../organizer-popup.exe .
          Pop-Location

      - name: Package Windows legal notices
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force licenses | Out-Null
          Copy-Item LICENSE licenses/MIT.txt
          Copy-Item THIRD_PARTY_NOTICES.md licenses/
          Copy-Item LICENSES/* licenses/
          Compress-Archive -Path organizer-windows-amd64.exe,organizer-popup.exe,licenses -DestinationPath organizer-windows-amd64-bundle.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: |
            ${{ matrix.binary }}
            organizer-popup.exe
            organizer-windows-amd64-bundle.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            organizer-linux-amd64
            organizer-linux-arm64
            organizer-windows-amd64.exe
            organizer-popup.exe
            organizer-windows-amd64-bundle.zip
          generate_release_notes: true

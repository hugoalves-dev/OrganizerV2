<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>OrganizerV2</title>
<style>
:root{font-family:Segoe UI,system-ui,sans-serif;color:#202633}
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#f5f7fb}
main{height:100%;background:white;border:1px solid #e2e6ed;border-radius:17px;padding:13px 16px;box-shadow:0 8px 26px #0002}
header{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:650}
#close{border:0;background:transparent;font-size:20px;cursor:pointer;color:#64748b}
#drag{display:flex;align-items:center;gap:12px;background:#ecf4ff;border:1px dashed #8badcc;border-radius:10px;padding:10px;margin:9px 0;cursor:grab;user-select:none}
#drag:active{cursor:grabbing} #filename{font-weight:650;max-width:275px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#folder{font-size:11px;color:#526276}label{font-size:11px;font-weight:600;display:block}
select{width:100%;padding:5px;margin:3px 0;border-radius:6px;border:1px solid #d8dfeb;background:white}
#actions{display:flex;gap:7px;margin-top:6px}
#actions button{flex:1;padding:7px 3px;border:1px solid #d3dbea;border-radius:7px;background:#f7faff;cursor:pointer;font-size:11px}
#actions button:disabled{opacity:.5;cursor:default}
#status{margin-top:7px;font-size:10px;color:#516177;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body>
<main role="status">
<header><span>✓ File organized</span><button type="button" id="close" aria-label="Dismiss">×</button></header>
<div id="drag" draggable="true" role="button" tabindex="0"><span aria-hidden="true">📄</span><div>
<div id="filename"></div><div id="folder"></div></div></div>
<label for="destination">Move file to</label><select id="destination"></select>
<div id="actions"></div><div id="status">Drag to Explorer to copy</div>
</main><script type="module" src="./main.js"></script></body></html>

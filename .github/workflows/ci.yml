name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: 

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
        continue-on-error: true

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            artifact_name: organizer-linux-amd64
            binary_name: organizer-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            artifact_name: organizer-linux-arm64
            binary_name: organizer-linux-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: organizer-windows-amd64
            binary_name: organizer-windows-amd64.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          pushd cmd/organizer
          go run github.com/tc-hib/go-winres@v0.3.3 make \
            --arch "${{ matrix.goarch }}" \
            --in winres/winres.json \
            --out rsrc
          test -s "rsrc_windows_${{ matrix.goarch }}.syso"
          popd

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary_name }}" ./cmd/organizer

      # The optional AGPL Wails helper has its own Go module and requires CGO.
      # Keep it out of the headless 1.25 / CGO_ENABLED=0 watcher build.
      - uses: actions/setup-go@v5
        if: matrix.goos == 'windows'
        with:
          go-version-file: cmd/organizer-popup/go.mod
          cache: false

      - name: Build Wails popup helper (Windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          Push-Location cmd/organizer-popup
          go mod tidy
          if ($LASTEXITCODE -ne 0) { throw 'popup dependencies failed' }
          go run github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.32 generate bindings -d ./assets/bindings
          if ($LASTEXITCODE -ne 0) { throw 'Wails bindings failed' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'popup tests failed' }
          go build -trimpath -tags production -ldflags="-H windowsgui" -o ../../dist/organizer-popup.exe .
          if ($LASTEXITCODE -ne 0) { throw 'popup build failed' }
          # IMAGE_SUBSYSTEM_WINDOWS_GUI (2), not console (3).
          $binary = [IO.File]::ReadAllBytes('../../dist/organizer-popup.exe')
          $peOffset = [BitConverter]::ToInt32($binary, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($binary, $peOffset + 0x5c)
          if ($subsystem -ne 2) { throw "popup helper has unexpected PE subsystem: $subsystem" }
          if ($LASTEXITCODE -ne 0) { throw 'popup build failed' }
          Pop-Location

      - name: Package Windows popup with required license notices
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/licenses | Out-Null
          Copy-Item LICENSE dist/licenses/MIT.txt
          Copy-Item THIRD_PARTY_NOTICES.md dist/licenses/
          Copy-Item LICENSES/* dist/licenses/
          Compress-Archive -Path dist/organizer-windows-amd64.exe,dist/organizer-popup.exe,dist/licenses -DestinationPath dist/organizer-windows-amd64-bundle.zip

      - name: Install GTK3 and WebKitGTK build dependencies
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        with:
          go-version-file: cmd/organizer-popup/go.mod
          cache: false

      - name: Build experimental Wails popup helper (Linux GTK3)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          CGO_ENABLED: "1"
        run: |
          cd cmd/organizer-popup
          go mod tidy
          go run -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.32 generate bindings -d ./assets/bindings
          go test -tags gtk3 ./...
          go build -trimpath -tags "gtk3 production" -o ../../dist/organizer-popup .

      - name: Package optional Linux popup and all license notices
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          mkdir -p dist/licenses
          cp LICENSE dist/licenses/MIT.txt
          cp LICENSES/* dist/licenses/
          cp THIRD_PARTY_NOTICES.md dist/licenses/
          (cd dist && tar -czf organizer-linux-amd64-bundle.tar.gz organizer-linux-amd64 organizer-popup licenses)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.binary_name }}
            dist/organizer-popup.exe
            dist/organizer-popup
            dist/organizer-windows-amd64-bundle.zip
            dist/organizer-linux-amd64-bundle.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: organizer-*
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.${{ github.run_number }}
          name: Release v0.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
